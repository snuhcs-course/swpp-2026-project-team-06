<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>farmclub 관리자 · 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
<main class="login">
  <section class="card" aria-labelledby="title">
    <div class="row" style="align-items: baseline"><span class="brand">farmclub<i></i></span><span class="tag">관리자</span></div>
    <h1 id="title" style="margin-top: 16px">로그인</h1>
    <form id="form" novalidate>
      <label for="password">접속 비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <p class="error" id="error" role="alert" hidden></p>
      <button class="primary" type="submit" id="submit">로그인</button>
    </form>
    <p class="hint" style="margin: 16px 0 0">
      로그인은 12시간 유지돼요. 승인·반려는 운영자 계정(u-admin) 이름으로 기록돼요.
    </p>
  </section>
</main>
<script>
const form = document.getElementById("form"), input = document.getElementById("password");
const error = document.getElementById("error"), submit = document.getElementById("submit");
const next = new URLSearchParams(location.search).get("next");
const target = next && /^\/(?!\/)[A-Za-z0-9/_?=&-]*$/.test(next) ? next : "/producers";

function fail(msg) { error.textContent = msg; error.hidden = false; input.focus(); input.select(); }

form.onsubmit = async (e) => {
  e.preventDefault();
  const password = input.value;
  if (!password) return fail("비밀번호를 입력해 주세요.");
  submit.disabled = true; error.hidden = true;
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
      body: JSON.stringify({ password }),
    });
    const data = await r.json().catch(() => null);
    if (r.ok) { location.replace(target); return; }
    fail((data && data.message) || `로그인하지 못했어요 (${r.status})`);
  } catch {
    fail("서버에 연결하지 못했어요.");
  } finally {
    submit.disabled = false;
  }
};
</script>
</body>
</html>
