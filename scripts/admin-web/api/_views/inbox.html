<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>farmclub 관리자 · 문의함</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/admin.css">
<style>
  .msgs { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; max-height: 60vh; overflow-y: auto; }
  .msg { max-width: 80%; padding: 10px 12px; border-radius: 12px; background: var(--surface); white-space: pre-wrap; word-break: keep-all; overflow-wrap: break-word; }
  .msg.op { align-self: flex-end; background: #FFF1E8; }
  .msg .who { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .msg time { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .reply textarea { min-height: 88px; resize: vertical; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="content"><div class="wrap">
    <header class="page-head">
      <h1>문의함</h1>
      <p class="hint">생산자와 소비자가 앱의 farmclub 대화방에 남긴 문의예요. 답장은 각자의 앱에 'farmclub'으로 보여요.</p>
    </header>
    <nav class="tabs" id="tabs" aria-label="상태"></nav>
    <section id="list" aria-live="polite"></section>
  </div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="/assets/admin.js"></script>
<script>
// 문의함(DEV-111·DEV-150). 생산자 방(농가 ID)과 소비자 방(사용자 ID)을 함께 보이고, 답변 대기를 먼저 보여 준다.
// 대화를 열면 마지막 메시지까지 읽음으로 표시하고, 답장은 운영팀(OPERATOR) 메시지로 보낸다.
const TABS = { WAITING: "답변 대기", PRODUCER: "생산자", CONSUMER: "소비자", ALL: "전체" };
const KIND = { PRODUCER: "생산자", CONSUMER: "소비자" };
// 행마다 kind에 따라 경로가 다르다: 생산자 /admin/support/{farmId}, 소비자 /admin/support/consumers/{userId}
const base = (r) => r.kind === "CONSUMER" ? `/admin/support/consumers/${r.targetId}` : `/admin/support/${r.targetId}`;
const rowKey = (r) => `${r.kind}:${r.targetId}`;
const pick = (t) => !rows ? [] : t === "ALL" ? rows : t === "WAITING" ? rows.filter((r) => r.waiting) : rows.filter((r) => r.kind === t);
const WHO = { PRODUCER: "생산자", OPERATOR: "farmclub", AI: "AI", CONSUMER: "소비자" };
let tab = "WAITING", rows = null, open = null, busy = false;

function renderTabs() {
  const n = (t) => !rows ? "" : pick(t).length;
  $("#tabs").innerHTML = Object.entries(TABS).map(([t, label]) =>
    `<button aria-pressed="${t === tab}" data-tab="${t}">${label}${n(t) !== "" ? " " + n(t) : ""}</button>`).join("");
}

function photos(m) { return m.attachmentIds && m.attachmentIds.length ? `<span class="hint"> · 사진 ${m.attachmentIds.length}장</span>` : ""; }

function thread(page) {
  // 본문 줄바꿈을 살리려고 .msg는 pre-wrap이라, 태그 사이에 공백을 두지 않는다
  return `<div class="msgs">${page.items.map((m) =>
      `<div class="msg ${m.senderType === "OPERATOR" ? "op" : ""}"><span class="who">${esc(WHO[m.senderType] || m.senderType)}</span>${esc(m.body)}${photos(m)}<time>${when(m.createdAt)}</time></div>`).join("")}</div>
    <div class="reply">
      <label class="hint" for="reply-${esc(page.kind + "-" + page.targetId)}">farmclub으로 답장</label>
      <textarea id="reply-${esc(page.kind + "-" + page.targetId)}" maxlength="1000" placeholder="${page.kind === "CONSUMER" ? "소비자" : "생산자"}에게 보낼 답장을 적어 주세요"></textarea>
      <div class="row"><button class="primary" data-act="send">답장 보내기</button><button class="text" data-act="close">닫기</button></div>
    </div>`;
}

function card(r) {
  return `<article class="card app" data-id="${esc(rowKey(r))}">
    <div class="row" style="justify-content: space-between">
      <h2>${esc(r.name)} <span class="badge">${KIND[r.kind] || esc(r.kind)}</span></h2>
      <span class="badge ${r.waiting ? "s-PENDING" : "s-APPROVED"}">${r.waiting ? "답변 대기" : "답변함"}${r.unreadCount ? " · 새 문의 " + r.unreadCount : ""}</span>
    </div>
    <dl class="meta">
      <dt>${r.kind === "CONSUMER" ? "계정" : "생산자"}</dt><dd>${esc(r.detail)} <span class="hint">· ${esc(r.targetId)}</span></dd>
      <dt>최근</dt><dd>${esc(WHO[r.lastSenderType] || r.lastSenderType)}: ${esc(r.lastMessage)} <span class="hint">· ${when(r.lastAt)}</span></dd>
    </dl>
    <div class="row"><button data-act="open">${open === rowKey(r) ? "다시 불러오기" : "대화 보기"}</button></div>
    <div class="slot"></div>
  </article>`;
}

function renderList() {
  renderTabs();
  if (!rows) { $("#list").innerHTML = `<p class="empty">불러오는 중…</p>`; return; }
  const shown = pick(tab);
  $("#list").innerHTML = shown.length ? shown.map(card).join("") : `<p class="empty">${tab === "WAITING" ? "답변을 기다리는 문의가 없어요." : "대화방이 없어요."}</p>`;
}

async function load() {
  try { rows = await call("/admin/support"); }
  catch (e) { rows = []; toast(e.message, true); }
  renderList();
  // 다시 불러올 때는 읽음을 옮기지 않는다(읽음은 운영자가 대화를 열 때만)
  if (open) { const el = $(`article[data-id="${CSS.escape(open)}"]`); if (el) await show(el, open, false); }
}

async function show(el, id, markRead = true) {
  const r = rows.find((x) => rowKey(x) === id); if (!r) return;
  const page = await call(`${base(r)}/messages`);
  el.querySelector(".slot").innerHTML = thread(page);
  const box = el.querySelector(".msgs"); box.scrollTop = box.scrollHeight;
  const last = page.items[page.items.length - 1];
  if (markRead && last && page.unreadCount) await call(`${base(r)}/read`, "POST", { messageId: last.messageId });
}

$("#tabs").onclick = (e) => { const b = e.target.closest("button[data-tab]"); if (b) { tab = b.dataset.tab; renderList(); } };

$("#list").onclick = async (e) => {
  const b = e.target.closest("button[data-act]"); if (!b || busy) return;
  const el = b.closest("article"), id = el.dataset.id, act = b.dataset.act;
  busy = true; b.disabled = true;
  try {
    if (act === "open") { open = id; await show(el, id); }
    else if (act === "close") { open = null; el.querySelector(".slot").innerHTML = ""; }
    else if (act === "send") {
      const text = el.querySelector("textarea").value.trim();
      if (!text) { toast("답장을 적어 주세요.", true); return; }
      const r = rows.find((x) => rowKey(x) === id);
      if (!r) { toast("목록이 바뀌었어요. 다시 불러와 주세요.", true); await load(); return; }
      await call(`${base(r)}/messages`, "POST", { text });
      toast("답장을 보냈어요");
      await load();
    }
  } catch (err) { toast(err.message, true); }
  finally { busy = false; b.disabled = false; }
};

rows = null; renderList(); load();
</script>
</body>
</html>
