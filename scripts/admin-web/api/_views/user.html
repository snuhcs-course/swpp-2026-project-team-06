<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>farmclub 관리자 · 사용자 찾기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="content"><div class="wrap">
    <header class="page-head">
      <h1>사용자 찾기</h1>
      <p class="hint">사용자 ID·주문 ID·주문 번호(입금자명 FC-MMDD-NNNN)로 찾아 주문·입금·환불을 보고 처리해요. 받는 사람 전화·주소는 보이지 않아요.</p>
    </header>
    <form id="find" class="row" style="margin-bottom: 16px">
      <input id="q" name="q" placeholder="u-… / o-… / FC-1021-1234" autocomplete="off" style="flex: 1; min-width: 200px">
      <button class="primary" type="submit">찾기</button>
    </form>
    <section id="view" aria-live="polite"></section>
  </div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="/assets/admin.js"></script>
<script>
// 사용자 상세(DEV-106). 읽기는 GET /admin/users/{id}, 처리 버튼은 기존 /admin/orders/{id}/… 운영 API.
// 처리 규칙(R-11·R-12·R-19·R-28)은 서버가 다시 검사하고, 이 화면은 두 번 눌러 확인만 한다.
const ROLE = { CONSUMER: "소비자", PRODUCER: "생산자", ADMIN: "운영자" };
const STATUS = {
  AWAITING_DEPOSIT: "입금 대기", RESERVED: "예약 완료", PREPARING: "출하 준비", SHIPPED: "출하됨",
  DELIVERED: "배송 완료", COMPLETED: "구매 확정", REFUNDED: "환불", CANCELED: "취소",
};
const PAYMENT = { APPROVED: "입금 확인", PARTIALLY_REFUNDED: "부분 환불", REFUNDED: "전액 환불" };
const ACTOR = { MANAGER: "운영자", CONSUMER: "소비자", SYSTEM: "자동" };
const won = (n) => Number(n || 0).toLocaleString("ko-KR") + "원";
const idOk = (v) => /^[A-Za-z0-9_-]+$/.test(v);
let detail = null, busy = false;

function currentId() {
  const m = location.pathname.match(/^\/users\/([A-Za-z0-9_-]+)$/);
  return m ? m[1] : "";
}

function orderCard(o) {
  const lines = [
    ["주문 번호", `<code>${esc(o.orderNo)}</code> <span class="hint">${esc(o.orderId)}</span>`],
    ["상품", `${esc(o.productName)} × ${o.quantity} <span class="hint">· ${esc(o.farmName)} (${esc(o.farmId)})</span>`],
    ["금액", won(o.totalAmount) + (o.refundedAmount ? ` <span class="hint">· 환불 ${won(o.refundedAmount)}, 남은 ${won(o.refundableAmount)}</span>` : "")],
    ["받는 사람", esc(o.recipient)],
    ["주문", when(o.createdAt)],
  ];
  if (o.status === "AWAITING_DEPOSIT") {
    lines.push(["입금 기한", when(o.depositDueAt)]);
    lines.push(["입금 알림", o.depositReportedAt ? `${when(o.depositReportedAt)} <span class="hint">소비자가 '입금했어요'를 눌렀어요</span>` : "아직"]);
  }
  if (o.paidAt) lines.push(["입금 확인", `${when(o.paidAt)}${o.depositConfirmedBy === "ADMIN" ? ' <span class="hint">· 운영자 대행</span>' : ""}`]);
  if (o.shippedAt) lines.push(["출하", when(o.shippedAt)]);
  if (o.deliveredAt) lines.push(["배송 완료", when(o.deliveredAt)]);
  if (o.cancelReason) lines.push(["취소 사유", esc(o.cancelReason)]);
  const refunds = o.refunds.length ? `<ul class="history">${o.refunds.map((r) =>
    `<li>${when(r.createdAt)} · ${won(r.amount)} · ${esc(ACTOR[r.actor] || r.actor)} · ${esc(r.reason)}${r.settledAt ? ` <span class="hint">· 농가 송금 ${when(r.settledAt)}</span>` : ' <span class="hint">· 농가 송금 전</span>'}</li>`).join("")}</ul>` : "";
  const buttons = [
    o.actions.includes("confirm_deposit") ? `<button class="primary" data-act="confirm-deposit">입금 확인 대행</button>` : "",
    o.actions.includes("delivered") ? `<button class="primary" data-act="delivered">배송 완료로</button>` : "",
    o.actions.includes("refund") ? `<button class="danger" data-act="refund-form">환불</button>` : "",
  ].join("");
  return `<article class="card app" data-id="${esc(o.orderId)}">
    <div class="row" style="justify-content: space-between">
      <h2>${esc(o.productName)}</h2>
      <span class="badge">${esc(STATUS[o.status] || o.status)}${o.paymentStatus ? " · " + esc(PAYMENT[o.paymentStatus] || o.paymentStatus) : ""}</span>
    </div>
    <dl class="meta">${lines.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${refunds}
    ${buttons ? `<div class="row">${buttons}</div>` : ""}
    <div class="slot"></div>
  </article>`;
}

function render() {
  if (!detail) return;
  const d = detail;
  const head = `<article class="card app">
    <div class="row" style="justify-content: space-between">
      <h2>${esc(d.nickname || d.name)}</h2>
      <span class="badge">${esc(ROLE[d.role] || d.role)}${d.isTestAccount ? " · 테스트 계정" : ""}</span>
    </div>
    <dl class="meta">
      <dt>이름</dt><dd>${esc(d.name)}${d.nickname ? ` <span class="hint">· 닉네임 ${esc(d.nickname)}</span>` : ""}</dd>
      <dt>사용자 ID</dt><dd><code>${esc(d.userId)}</code></dd>
      <dt>가입</dt><dd>${when(d.createdAt)} <span class="hint">· ${d.kakaoLinked ? "카카오" : "시드·테스트 로그인"}</span></dd>
      ${d.farm ? `<dt>농가</dt><dd>${esc(d.farm.name)} <span class="hint">· ${esc(d.farm.farmId)} · ${esc(d.farm.approvalStatus)}</span></dd>` : ""}
    </dl>
  </article>`;
  const orders = d.role !== "CONSUMER" ? `<p class="empty">소비자 계정이 아니라 주문 내역이 없어요.</p>`
    : d.orders.length ? d.orders.map(orderCard).join("") + (d.ordersTruncated ? `<p class="hint">최근 100건만 보여요.</p>` : "")
    : `<p class="empty">주문이 없어요.</p>`;
  $("#view").innerHTML = head + `<h2 style="margin: 20px 0 8px">주문 ${d.orders.length}건</h2>` + orders;
}

async function load(id) {
  $("#q").value = id;
  $("#view").innerHTML = `<p class="empty">불러오는 중…</p>`;
  try { detail = await call(`/admin/users/${id}`); render(); }
  catch (e) { detail = null; $("#view").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}

$("#find").onsubmit = async (e) => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (!idOk(q)) { toast("ID나 주문 번호를 확인해 주세요.", true); return; }
  let id = q;
  if (!q.startsWith("u-")) {
    try { id = (await call(`/admin/users/by-order/${q}`)).userId; }
    catch (err) { toast(err.message, true); return; }
  }
  history.pushState(null, "", "/users/" + id);
  load(id);
};

function refundForm(o) {
  return `<div class="reject-box">
    <p>남은 결제 금액 ${won(o.refundableAmount)}. 금액을 비우면 남은 금액 전부(전액 환불)예요. 송금은 농가가 하고, 이 화면은 환불 기록과 주문 상태만 바꿔요.</p>
    <div class="row"><input data-f="amount" inputmode="numeric" placeholder="금액(원), 비우면 전액" style="width: 180px">
    <input data-f="reason" maxlength="500" placeholder="사유(소비자에게 보여요)" style="flex: 1; min-width: 200px"></div>
    <div class="row"><button class="danger solid" data-act="refund">환불하기</button><button class="text" data-act="cancel">취소</button></div>
  </div>`;
}

const CONFIRM = {
  "confirm-deposit": ["입금 확인을 대신할까요? 한 번 더 누르기", "입금 확인했어요"],
  delivered: ["배송 완료로 바꿀까요? 한 번 더 누르기", "배송 완료로 바꿨어요"],
  refund: ["환불할까요? 한 번 더 누르기", "환불했어요"],
};

$("#view").onclick = async (e) => {
  const b = e.target.closest("button[data-act]"); if (!b || busy) return;
  const el = b.closest("article"), id = el.dataset.id, act = b.dataset.act, slot = el.querySelector(".slot");
  const o = detail.orders.find((x) => x.orderId === id);
  if (act === "refund-form") { slot.innerHTML = refundForm(o); return; }
  if (act === "cancel") { slot.innerHTML = ""; return; }
  if (!CONFIRM[act]) return;
  let body = {};
  if (act === "refund") {
    const raw = slot.querySelector('[data-f="amount"]').value.replace(/[,\s원]/g, "");
    const reason = slot.querySelector('[data-f="reason"]').value.trim();
    if (!reason) { toast("환불 사유를 적어 주세요.", true); return; }
    if (raw && !/^\d+$/.test(raw)) { toast("금액은 숫자로 적어 주세요.", true); return; }
    body = raw ? { amount: Number(raw), reason } : { reason };
  }
  if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = CONFIRM[act][0]; return; }
  busy = true; b.disabled = true;
  try {
    await call(`/admin/orders/${id}/${act}`, "POST", body);
    toast(CONFIRM[act][1]);
  } catch (err) { toast(err.message, true); }
  finally { busy = false; await load(detail.userId); }
};

window.onpopstate = () => { const id = currentId(); if (id) load(id); };
if (currentId()) load(currentId());
</script>
</body>
</html>
