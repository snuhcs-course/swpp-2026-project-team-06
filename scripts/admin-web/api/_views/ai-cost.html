<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>farmclub 관리자 · AI 비용</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/admin.css">
<style>
/* AI 비용 화면 전용(DEV-144): 표는 공용 .box, 여기엔 합계 줄·회수·대상 칸·결과 배지만 */
.sum td { font-weight: 700; background: var(--surface); }
td .n { color: var(--muted); font-weight: 400; margin-left: 4px; font-size: 13px; }
td a { color: var(--text); }
td.title { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.st { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
.st-PASS { background: #E9F5EE; color: var(--ok); }
.st-MISMATCH { background: #FFF3E8; color: var(--accent); }
.st-INCOMPLETE, .st-SKIPPED { background: var(--surface); color: var(--muted); }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="content"><div class="wrap">
    <header class="page-head">
      <h1>AI 비용</h1>
      <p class="hint">토큰 × 공개 단가로 낸 추정치(USD)예요. 자료 분석은 제공자가 알려 준 금액이고, 코드 리뷰는 PR마다 도는 spec-check예요.</p>
    </header>
    <div class="box"><table>
      <thead><tr><th>기능</th><th class="num">이번 달</th><th class="num">최근 7일</th><th class="num">전체</th></tr></thead>
      <tbody id="sum"><tr><td colspan="4" class="empty">불러오는 중…</td></tr></tbody>
    </table></div>
    <nav class="tabs" id="tabs" aria-label="기능"></nav>
    <div class="box"><table>
      <thead><tr><th>시각</th><th>기능</th><th>대상</th><th>모델</th><th class="num">입력/출력</th><th class="num">금액</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div style="text-align: center"><button id="more" hidden>더 보기</button></div>
  </div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="/assets/admin.js"></script>
<script>
// AI 비용(DEV-144): 기능별·전체 합계(이번 달 KST·최근 7일·전체)와 호출 목록(최신순, 50건씩, 기능으로 거름).
const FEATURE = { spec_check: "코드 리뷰", product_draft: "상품 초안", detail_draft: "상세 초안", ai_answer: "AI 답변", source_analysis: "자료 분석" };
const STATUS = { PASS: "통과", MISMATCH: "불일치", INCOMPLETE: "미완료", SKIPPED: "건너뜀" };
const REPO = "https://github.com/snuhcs-course/swpp-2026-project-team-06";
const n = (v) => Number(v || 0).toLocaleString("ko-KR");
// 1센트 미만은 소수 넷째 자리까지 보여 0으로 보이지 않게 한다
const usd = (v) => v == null ? "—" : "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: v > 0 && v < 0.01 ? 4 : 2 });
const short = (iso) => new Date(iso).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
let feature = "", cursor = null, busy = false;

// 금액 옆 회수. 금액 모르는 호출이 있으면 "N 금액 없음"
const cell = (t) => `<td class="num" title="입력 ${n(t.inputTokens)} · 출력 ${n(t.outputTokens)}">${usd(t.costUsd)}<span class="n">${n(t.calls)}회${t.unpricedCalls ? `, ${n(t.unpricedCalls)} 금액 없음` : ""}</span></td>`;

function renderSummary(page) {
  $("#sum").innerHTML = page.features.map((f) =>
    `<tr><td>${esc(FEATURE[f.feature] || f.feature)}</td>${cell(f.thisMonth)}${cell(f.last7Days)}${cell(f.total)}</tr>`).join("")
    + `<tr class="sum"><td>합계</td>${cell(page.overall.thisMonth)}${cell(page.overall.last7Days)}${cell(page.overall.total)}</tr>`;
  $("#tabs").innerHTML = [["", "전체"], ...page.features.map((f) => [f.feature, FEATURE[f.feature] || f.feature])]
    .map(([k, label]) => `<button aria-pressed="${k === feature}" data-f="${k}">${esc(label)}</button>`).join("");
}

function target(r) {
  if (r.feature !== "spec_check") return `<span class="hint">—</span>`;
  const pr = r.ref.replace("#", "");
  return `<span class="st st-${esc(r.status)}">${STATUS[r.status] || esc(r.status)}</span> <a href="${REPO}/pull/${esc(pr)}" target="_blank" rel="noopener">${esc(r.ref)}</a> ${esc(r.title)}`;
}

function row(r) {
  const time = r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${short(r.createdAt)}</a>` : short(r.createdAt);
  return `<tr><td>${time}</td><td>${esc(FEATURE[r.feature] || r.feature)}</td><td class="title" title="${esc(r.title)}">${target(r)}</td>
    <td><code>${esc(r.model || "—")}</code></td><td class="num">${n(r.inputTokens)} / ${n(r.outputTokens)}</td><td class="num">${usd(r.costUsd)}</td></tr>`;
}

async function load(next) {
  if (busy) return;
  busy = true;
  try {
    const q = "/admin/ai-usage?limit=50" + (feature ? "&feature=" + feature : "") + (next ? "&cursor=" + next : "");
    const page = await call(q); // feature·cursor는 영문·base64url이라 그대로 붙인다
    if (!next) { renderSummary(page); $("#rows").innerHTML = ""; }
    $("#rows").insertAdjacentHTML("beforeend", page.items.map(row).join(""));
    if (!next && !page.items.length) $("#rows").innerHTML = `<tr><td colspan="6" class="empty">아직 기록이 없어요.</td></tr>`;
    cursor = page.nextCursor;
    $("#more").hidden = !cursor;
  } catch (e) {
    toast(e.message, true);
  } finally {
    busy = false;
  }
}

$("#tabs").onclick = (e) => { const b = e.target.closest("button[data-f]"); if (b) { feature = b.dataset.f; load(); } };
$("#more").onclick = () => load(cursor);
load();
</script>
</body>
</html>
