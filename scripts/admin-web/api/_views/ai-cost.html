<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>farmclub 관리자 · AI 비용</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/admin.css">
<style>
/* AI 비용 화면 전용(DEV-144): 합계 세 칸과 실행별 표 */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { margin: 0; }
.stat .label { font-size: 13px; color: var(--muted); }
.stat .money { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin: 4px 0; }
.stat .sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: top; }
th { font-size: 13px; font-weight: 600; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.pr { white-space: normal; min-width: 220px; }
td a { color: var(--text); }
td.pr a { font-weight: 600; text-decoration: none; }
td.pr a:hover { text-decoration: underline; }
.st { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
.st-PASS { background: #E9F5EE; color: var(--ok); }
.st-MISMATCH { background: #FFF3E8; color: var(--accent); }
.st-INCOMPLETE, .st-SKIPPED { background: var(--surface); color: var(--muted); }
.more { margin-top: 12px; text-align: center; }
@media (max-width: 760px) { .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="content"><div class="wrap">
    <header class="page-head">
      <h1>AI 비용</h1>
      <p class="hint" style="margin: 4px 0 0">PR마다 도는 spec-code-review가 Claude API를 부른 비용이에요. 금액은 입력·출력 토큰에 모델 공개 단가를 곱한 추정치(USD)이고, 실제 청구서와 조금 다를 수 있어요.</p>
    </header>
    <section class="stats" id="stats" aria-label="합계"></section>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>실행</th><th>PR</th><th>결과</th><th>모델</th>
          <th class="num">입력 토큰</th><th class="num">출력 토큰</th><th class="num">금액</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="empty">불러오는 중…</td></tr></tbody>
      </table>
    </div>
    <div class="more"><button id="more" hidden>더 보기</button></div>
  </div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="/assets/admin.js"></script>
<script>
// spec-check AI 비용(DEV-144): 합계(전체·이번 달·최근 7일)와 실행별 목록(최신순, 50건씩).
const REPO = "https://github.com/snuhcs-course/swpp-2026-project-team-06";
const STATUS = { PASS: "통과", MISMATCH: "불일치", INCOMPLETE: "미완료", SKIPPED: "건너뜀" };
const MODE = { pr: "", "demo-mismatch": "데모", "demo-matched": "데모" };
const n = (v) => Number(v || 0).toLocaleString("ko-KR");
const usd = (v, digits = 2) => v == null ? "단가 없음" : "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
let cursor = null, busy = false;

function stat(label, t) {
  return `<article class="card stat">
    <div class="label">${label}</div>
    <div class="money">${usd(t.costUsd)}</div>
    <div class="sub">${n(t.runs)}회 · 입력 ${n(t.inputTokens)} · 출력 ${n(t.outputTokens)}${t.unpricedRuns ? ` · 단가 없는 ${n(t.unpricedRuns)}회 제외` : ""}</div>
  </article>`;
}

function row(r) {
  const mode = MODE[r.mode] ?? r.mode;
  return `<tr>
    <td><a href="${esc(r.runUrl)}" target="_blank" rel="noopener">${when(r.createdAt)}</a></td>
    <td class="pr"><a href="${REPO}/pull/${r.prNumber}" target="_blank" rel="noopener">#${r.prNumber}</a> ${esc(r.prTitle)}${mode ? ` <span class="hint">(${esc(mode)})</span>` : ""}</td>
    <td><span class="st st-${esc(r.status)}">${STATUS[r.status] || esc(r.status)}</span></td>
    <td><code>${esc(r.model)}</code></td>
    <td class="num">${n(r.inputTokens)}</td>
    <td class="num">${n(r.outputTokens)}</td>
    <td class="num">${usd(r.costUsd, 4)}</td>
  </tr>`;
}

async function load(next) {
  if (busy) return;
  busy = true;
  try {
    const page = await call("/admin/spec-check-runs?limit=50" + (next ? "&cursor=" + next : "") /* cursor는 base64url이라 그대로 붙인다 */);
    if (!next) {
      $("#stats").innerHTML = stat("전체", page.total) + stat("이번 달", page.thisMonth) + stat("최근 7일", page.last7Days);
      $("#rows").innerHTML = "";
    }
    $("#rows").insertAdjacentHTML("beforeend", page.items.map(row).join(""));
    if (!next && !page.items.length) $("#rows").innerHTML = `<tr><td colspan="7" class="empty">아직 기록된 실행이 없어요.</td></tr>`;
    cursor = page.nextCursor;
    $("#more").hidden = !cursor;
  } catch (e) {
    if (!next) $("#rows").innerHTML = `<tr><td colspan="7" class="empty">불러오지 못했어요.</td></tr>`;
    toast(e.message, true);
  } finally {
    busy = false;
  }
}

$("#more").onclick = () => load(cursor);
load();
</script>
</body>
</html>
