<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>farmclub 관리자 · 아이디 계정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="content"><div class="wrap">
    <header class="page-head">
      <h1>아이디 계정</h1>
      <p class="hint">일반 사용자는 카카오로 가입해요. 아이디·비밀번호 계정은 원스토어 심사·UAT 테스트용으로 여기서만 만들어요. 임시 비밀번호는 만든 직후 한 번만 보여요.</p>
    </header>

    <section class="card">
      <h2>새 아이디 계정</h2>
      <form id="create" novalidate>
        <nav class="tabs" id="apps" aria-label="앱" style="margin-top: 12px"></nav>
        <div class="fields">
          <div class="field">
            <label for="username">아이디</label>
            <input id="username" name="username" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="20" aria-describedby="username-msg">
            <p class="hint" id="username-msg">영문 소문자로 시작하는 영문 소문자·숫자 4~20자</p>
          </div>
          <div class="field">
            <label for="nickname" id="nickname-label"></label>
            <input id="nickname" name="nickname" autocomplete="off" aria-describedby="nickname-msg">
            <p class="hint" id="nickname-msg"></p>
          </div>
          <div class="field" id="phone-field">
            <label for="phone">휴대폰 <span class="hint">(선택)</span></label>
            <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="010-0000-0000" maxlength="13" aria-describedby="phone-msg">
            <p class="hint" id="phone-msg">비우면 사용자가 처음 로그인할 때 적어요</p>
          </div>
        </div>
        <button class="primary" type="submit" id="submit">아이디 계정 만들기</button>
      </form>
      <div id="created"></div>
    </section>

    <h2 style="margin: 24px 0 12px">만든 계정</h2>
    <form id="search" class="row" style="gap: 8px; margin: 0 0 12px" role="search">
      <input id="q" type="search" placeholder="아이디, 닉네임·이름, 전화 끝 4자리" aria-label="검색어" autocomplete="off">
      <button class="primary" type="submit">찾기</button>
    </form>
    <nav class="tabs" id="filters" aria-label="앱"></nav>
    <p class="hint" id="count"></p>
    <section id="list" aria-live="polite"></section>
  </div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="/assets/admin.js"></script>
<script>
// 운영자가 만드는 아이디 계정(DEV-363, AC-01-22). 공개 아이디 가입은 없다(PM 11/18).
// 서버가 임시 비밀번호를 만들어 응답에 한 번만 준다 → .secret-box에만 보이고 저장·콘솔에 남기지 않는다(assets/admin.js).
// 사용자는 첫 로그인에서 비밀번호를 바꾸고 필수 약관에 동의한다. 다시 발급은 목록의 ‘임시 비밀번호’(AC-01-31)
const APPS = { consumer: "소비자", producer: "생산자" };
const FILTERS = { ALL: "전체", consumer: "소비자", producer: "생산자" };
const ROLE_LABEL = { CONSUMER: "소비자", PRODUCER: "생산자" };
const FARM = { APPROVED: "공개 중", PENDING: "확인 중", REJECTED: "반려", SUSPENDED: "정지" };
const CREATED_NOTE = "이 창을 닫으면 다시 볼 수 없어요. 사용자에게 아이디와 함께 알려 주면, 처음 로그인할 때 새 비밀번호로 바꾸고 약관에 동의해요.";
// 서버 규칙과 같게(server/app/accounts/passwords.py·service.py). 예약어·중복은 서버가 알려 준다
const USERNAME = /^[a-z][a-z0-9]{3,19}$/;
const PHONE = /^01[016789]-?\d{3,4}-?\d{4}$/;
const HINTS = {
  username: "영문 소문자로 시작하는 영문 소문자·숫자 4~20자",
  phone: "비우면 사용자가 처음 로그인할 때 적어요",
};
let app = "consumer", filter = "ALL", q = "", rows = null, creating = false;

// ---- 만들기 폼 ----
function nicknameHint() { return app === "consumer" ? "농가에 보이는 이름, 2~12자" : "농가 가입 신청 전까지 보이는 계정 이름, 2~20자. 비우면 ‘농가 사용자’"; }

function renderForm() {
  $("#apps").innerHTML = Object.entries(APPS).map(([k, l]) => `<button type="button" aria-pressed="${k === app}" data-app="${k}">${l}</button>`).join("");
  $("#nickname-label").innerHTML = app === "consumer" ? "닉네임" : `이름 <span class="hint">(선택)</span>`;
  $("#nickname").maxLength = app === "consumer" ? 12 : 20;
  $("#phone-field").hidden = app !== "consumer";
  for (const k of ["username", "nickname", "phone"]) setError(k, "");
}

// 칸 아래 안내를 오류(빨강)로 바꾸거나 되돌린다
function setError(field, msg) {
  const input = $("#" + field), p = $("#" + field + "-msg");
  if (msg) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");
  p.className = msg ? "error" : "hint";
  p.textContent = msg || (field === "nickname" ? nicknameHint() : HINTS[field]);
}

function values() {
  return {
    username: $("#username").value.trim().toLowerCase(), // 서버도 소문자로 맞춘다
    nickname: $("#nickname").value.trim(),
    phone: app === "consumer" ? $("#phone").value.trim() : "",
  };
}

function check(v) {
  const e = {};
  if (!v.username) e.username = "아이디를 적어 주세요";
  else if (!USERNAME.test(v.username)) e.username = HINTS.username + "예요";
  if (app === "consumer") {
    if (!v.nickname) e.nickname = "닉네임을 적어 주세요";
    else if (v.nickname.length < 2 || v.nickname.length > 12) e.nickname = "닉네임은 2~12자로 적어 주세요";
    if (v.phone && !PHONE.test(v.phone)) e.phone = "휴대폰 번호 형식으로 입력해 주세요";
  } else if (v.nickname && (v.nickname.length < 2 || v.nickname.length > 20)) {
    e.nickname = "이름은 2~20자로 적어 주세요";
  }
  return e;
}

$("#apps").onclick = (e) => { const b = e.target.closest("button[data-app]"); if (b) { app = b.dataset.app; renderForm(); } };
for (const k of ["username", "nickname", "phone"]) $("#" + k).addEventListener("input", () => setError(k, ""));

$("#create").onsubmit = async (e) => {
  e.preventDefault();
  if (creating) return;
  $("#created").innerHTML = ""; // 새로 만들면 지난 임시 비밀번호는 지운다
  const v = values(), errors = check(v);
  for (const k of ["username", "nickname", "phone"]) setError(k, errors[k]);
  const first = ["username", "nickname", "phone"].find((k) => errors[k]);
  if (first) { $("#" + first).focus(); return; }
  const body = { app, username: v.username };
  if (v.nickname) body.nickname = v.nickname;
  if (v.phone) body.phone = v.phone;
  creating = true; $("#submit").disabled = true;
  try {
    const r = await call("/admin/id-accounts", "POST", body);
    $("#create").reset(); renderForm();
    $("#created").innerHTML = r.temporaryPassword
      ? secretBox(r.temporaryPassword, r.username, CREATED_NOTE)
      : `<p class="error">계정은 이미 만들어졌어요. 목록에서 ‘임시 비밀번호’를 눌러 새로 발급해 주세요.</p>`;
    toast(`${APPS[app]} 아이디 ${r.username}을(를) 만들었어요`);
    loadList();
  } catch (err) {
    const fields = err.fields || {};
    const known = ["username", "nickname", "phone"].filter((k) => fields[k]);
    known.forEach((k) => setError(k, fields[k]));
    if (known.length) $("#" + known[0]).focus();
    else toast(err.message, true);
  } finally { creating = false; $("#submit").disabled = false; }
};

$("#created").onclick = (e) => { const b = e.target.closest("button[data-act]"); if (b) secretAction(b); };

// ---- 목록 ----
function badges(a) {
  const out = [];
  if (a.withdrawn) out.push(`<span class="badge s-WITHDRAWN">탈퇴</span>`);
  if (a.accountKind === "test") out.push(`<span class="badge s-PENDING">테스트</span>`);
  if (a.mustChangePassword) out.push(`<span class="badge s-PENDING">임시 비밀번호 사용 중</span>`);
  if (!a.consented) out.push(`<span class="badge s-PENDING">약관 동의 전</span>`);
  if (a.role === "PRODUCER") {
    out.push(a.farmStatus
      ? `<span class="badge s-${esc(a.farmStatus)}">농가 ${FARM[a.farmStatus] || esc(a.farmStatus)}</span>`
      : `<span class="badge s-WITHDRAWN">농가 신청 전</span>`);
  }
  return out.join("");
}

function card(a) {
  const producer = a.role === "PRODUCER";
  return `<article class="card app" data-id="${esc(a.userId)}">
    <div class="row" style="justify-content: space-between">
      <h2>${esc(a.username)}</h2><span class="row" style="gap: 4px">${badges(a)}</span>
    </div>
    <dl class="meta">
      <dt>아이디</dt><dd><code>${esc(a.username)}</code></dd>
      <dt>역할</dt><dd>${ROLE_LABEL[a.role] || esc(a.role)}</dd>
      <dt>${producer ? "이름" : "닉네임"}</dt><dd>${esc((producer ? a.name : a.nickname) || a.nickname || a.name || "—")}</dd>
      <dt>전화</dt><dd>${a.phoneLast4 ? "끝 " + esc(a.phoneLast4) : "—"}</dd>
      <dt>만든 시각</dt><dd>${when(a.createdAt)}</dd>
      <dt>ID</dt><dd><code>${esc(a.userId)}</code> · <a href="/users/${encodeURIComponent(a.userId)}">${producer ? "상세(상품·주문)" : "주문·입금 내역"}</a></dd>
    </dl>
    ${a.withdrawn ? "" : `<div class="row"><button class="danger" data-act="temp-password">임시 비밀번호</button></div>`}
    <div class="slot"></div>
  </article>`;
}

function renderList() {
  $("#filters").innerHTML = Object.entries(FILTERS).map(([k, l]) => `<button aria-pressed="${k === filter}" data-filter="${k}">${l}</button>`).join("");
  if (!rows) { $("#count").textContent = ""; $("#list").innerHTML = `<p class="empty">불러오는 중…</p>`; return; }
  $("#count").textContent = `${rows.length}개${rows.length >= 100 ? " (최근 만든 100개)" : ""}`;
  $("#list").innerHTML = rows.length ? rows.map(card).join("") : `<p class="empty">${q ? "찾는 계정이 없어요." : "아직 만든 아이디 계정이 없어요."}</p>`;
}

async function loadList() {
  rows = null; renderList();
  const params = new URLSearchParams({ limit: "100" });
  if (filter !== "ALL") params.set("app", filter);
  if (q) params.set("q", q);
  try { rows = await call("/admin/id-accounts?" + params); renderList(); }
  catch (e) { rows = []; renderList(); toast(e.message, true); }
}

$("#search").onsubmit = (e) => { e.preventDefault(); q = $("#q").value.trim(); loadList(); };
$("#filters").onclick = (e) => { const b = e.target.closest("button[data-filter]"); if (b) { filter = b.dataset.filter; loadList(); } };

$("#list").onclick = (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  if (secretAction(b)) return;
  const el = b.closest("article"), id = el.dataset.id, a = rows.find((r) => r.userId === id);
  if (b.dataset.act === "temp-password") issueTemporaryPassword(b, el.querySelector(".slot"), id, a.username);
};

renderForm();
loadList();
</script>
</body>
</html>
