# 로컬 개발용 PostgreSQL 16. 운영 DB는 Railway.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: farmclub
      POSTGRES_PASSWORD: farmclub
      POSTGRES_DB: farmclub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmclub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
