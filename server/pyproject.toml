[project]
name = "farmclub-server"
version = "0.1.0"
description = "Farmclub API 서버 (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.12.1",
    "boto3>=1.35",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=2.0",
    "pillow>=11",
    "pillow-heif>=1",
    "psutil>=6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr==3.10.0",
    "onnxruntime==1.31.0",
]

[dependency-groups]
dev = [
    "numpy>=2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
