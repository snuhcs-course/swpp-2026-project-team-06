<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SCR-02 농가 목록</title>
</head>
<body>
<div class="x-dc">

<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2) format("woff2-variations")}
body{margin:0;color-scheme:light;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111111;background:#FFFFFF;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:#111111;text-decoration:none}a:hover{color:#000000}
.t34{font-size:34px;font-weight:700;letter-spacing:-0.02em;line-height:1.15}
.t17{font-size:17px;line-height:1.5}
.t15{font-size:15px;line-height:1.45}
.muted{color:#6B6B6B}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:999px;background:#F5F5F3;font-size:15px;font-weight:600;color:#111111}
.ib{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#111111}
.frow{display:flex;gap:16px;padding:16px 0;color:#111111}
.frow + .frow{border-top:1px solid #E8E8E6}
.tabbar{position:absolute;left:12px;right:12px;bottom:12px;height:64px;border-radius:999px;background:rgba(255,255,255,0.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;padding:0 8px;box-sizing:border-box}
.tab{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;font-weight:600;color:#6B6B6B;border-radius:999px;position:relative}
.tab.on{color:#111111;background:#F5F5F3}
.badge{position:absolute;top:2px;left:50%;margin-left:8px;min-width:24px;height:24px;padding:0 8px;box-sizing:border-box;border-radius:999px;background:#C94F0C;color:#FFFFFF;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
</style>

<div style="width:390px;height:1040px;box-sizing:border-box;position:relative;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;padding-bottom:96px">

  <header style="height:48px;display:flex;align-items:center;padding:0 8px;flex:none">
    <a href="scr-01.html" class="ib" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  </header>

  <div style="padding:0 20px;display:flex;flex-direction:column;gap:16px">
    <h1 class="t34" style="margin:0">농가</h1>
    <label style="display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:8px;background:#F5F5F3;color:#6B6B6B">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" placeholder="농가 이름, 품종, 지역" style="flex:1;align-self:stretch;min-width:0;border:0;background:transparent;font-size:16px;font-family:inherit;color:#111111;outline:none">
    </label>
    <span class="t15 muted">마감 임박순 · 농가 12곳</span>
  </div>

  <div style="padding:4px 20px 0">
    <a href="scr-03.html" class="frow">
      <img src="../assets/farmer.jpg" alt="강씨네 귤밭" style="width:104px;height:104px;border-radius:16px;object-fit:cover;flex:none">
      <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0">
        <span class="t17" style="font-weight:600">강씨네 귤밭</span>
        <span class="t15 muted">제주 서귀포 · 하우스 감귤 5kg</span>
        <span style="display:flex;align-items:center;gap:8px;margin-top:4px"><span class="t17" style="font-weight:700">29,000원</span><span class="chip">D-5</span></span>
      </div>
    </a>
    <a href="#" class="frow">
      <img src="../assets/greenhouse-aisle.jpg" alt="효돈 하우스농원" style="width:104px;height:104px;border-radius:16px;object-fit:cover;flex:none">
      <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0">
        <span class="t17" style="font-weight:600">효돈 하우스농원</span>
        <span class="t15 muted">제주 서귀포 · 하우스 감귤 3kg</span>
        <span style="display:flex;align-items:center;gap:8px;margin-top:4px"><span class="t17" style="font-weight:700">19,000원</span><span class="chip">D-9</span></span>
      </div>
    </a>
    <a href="#" class="frow">
      <img src="../assets/harvest-hand.jpg" alt="한라네 과수원" style="width:104px;height:104px;border-radius:16px;object-fit:cover;flex:none">
      <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0">
        <span class="t17" style="font-weight:600">한라네 과수원</span>
        <span class="t15 muted">제주 제주시 · 노지 감귤 10kg</span>
        <span style="display:flex;align-items:center;gap:8px;margin-top:4px"><span class="t17" style="font-weight:700">24,000원</span><span class="chip">D-18</span></span>
      </div>
    </a>
    <a href="#" class="frow">
      <img src="../assets/branch.jpg" alt="위미 감귤농장" style="width:104px;height:104px;border-radius:16px;object-fit:cover;flex:none">
      <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0">
        <span class="t17" style="font-weight:600">위미 감귤농장</span>
        <span class="t15 muted">제주 남원 · 지금 판매 중인 상품 없음</span>
      </div>
    </a>
  </div>

  <nav class="tabbar">
    <a href="scr-01.html" class="tab on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>발견</a>
    <a href="scr-18.html" class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>소식</a>
    <a href="scr-15.html" class="tab" aria-label="채팅, 안 읽음 2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4z"/></svg>채팅<span class="badge">2</span></a>
    <a href="scr-17.html" class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>내 정보</a>
  </nav>
</div>
</div>
</body>
</html>
