<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공유 미리보기 · 농가 링크</title>
</head>
<body>
<div class="x-dc">

<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2) format("woff2-variations")}
body{margin:0;color-scheme:light;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111111;background:#FFFFFF;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:#111111;text-decoration:none}a:hover{color:#000000}
.t34{font-size:34px;font-weight:700;letter-spacing:-0.02em;line-height:1.15}
.t22{font-size:22px;font-weight:700;letter-spacing:-0.01em;line-height:1.3}
.t17{font-size:17px;line-height:1.5}
.t15{font-size:15px;line-height:1.45}
.muted{color:#6B6B6B}
.sk{background:#F5F5F3;border-radius:8px}
.tabbar{position:absolute;left:12px;right:12px;bottom:12px;height:64px;border-radius:999px;background:rgba(255,255,255,0.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;padding:0 8px;box-sizing:border-box}
.tab{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:15px;font-weight:600;color:#6B6B6B;border-radius:999px;position:relative}
.tab.on{color:#111111;background:#F5F5F3}
</style>

<div style="width:1200px;height:630px;position:relative;overflow:hidden;background:#111111">
  <img src="../assets/farmer.jpg" alt="귤을 든 강씨네 귤밭 농부" style="display:block;width:1200px;height:630px;object-fit:cover">
  <div style="position:absolute;inset:0;background:linear-gradient(to right, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.2) 70%, rgba(0,0,0,0) 100%)"></div>
  <div style="position:absolute;left:72px;top:64px;display:inline-flex;align-items:baseline;font-size:40px;font-weight:700;letter-spacing:-0.03em;line-height:1;color:#FFFFFF">farmclub<i style="display:inline-block;width:12px;height:12px;border-radius:999px;background:#C94F0C;margin-left:4px"></i></div>
  <div style="position:absolute;left:72px;bottom:72px;width:760px;display:flex;flex-direction:column;gap:16px;color:#FFFFFF">
    <span style="font-size:72px;font-weight:700;letter-spacing:-0.02em;line-height:1.1">강씨네 귤밭</span>
    <span style="font-size:32px;font-weight:600;line-height:1.3;opacity:0.92">제주 서귀포 · 하우스 감귤 수확 전 예약 중</span>
  </div>
</div>
</div>
</body>
</html>
