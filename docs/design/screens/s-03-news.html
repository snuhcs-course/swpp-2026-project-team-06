<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SCR-03 · 소식 선택</title>

<body>
<div class="x-dc">

<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111111;background:#FFFFFF;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:#111111;text-decoration:none}a:hover{color:#000000}
.t34{font-size:34px;font-weight:700;letter-spacing:-0.02em;line-height:1.15}
.t22{font-size:22px;font-weight:700;letter-spacing:-0.01em;line-height:1.25}
.t17{font-size:17px;line-height:1.5}
.t15{font-size:15px;line-height:1.45}
.t13{font-size:13px;line-height:1.4}
.muted{color:#6B6B6B}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:#F5F5F3;font-size:13px;font-weight:600;color:#111111}
.ov{position:absolute;top:8px;width:40px;height:40px;border-radius:999px;background:rgba(0,0,0,0.32);display:flex;align-items:center;justify-content:center;color:#FFFFFF;border:0;cursor:pointer}
.btn-p{flex:1;display:flex;align-items:center;justify-content:center;height:52px;border-radius:16px;background:#C94F0C;color:#FFFFFF;font-size:17px;font-weight:600}
.btn-o{flex:1;display:flex;align-items:center;justify-content:center;height:52px;border-radius:16px;border:1.5px solid #111111;color:#111111;font-size:17px;font-weight:600;box-sizing:border-box}
.prow{display:flex;gap:14px;padding:16px 0;color:#111111;position:relative}
.prow + .prow{border-top:1px solid #E8E8E6}
.prow .nm{font-size:17px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow .cnt{position:absolute;right:0;bottom:16px;font-size:13px;color:#6B6B6B}
.like{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 4px;color:#6B6B6B;font-size:15px;font-weight:600;background:transparent;border:0;font-family:inherit;cursor:pointer}
.tabbar{position:absolute;left:12px;right:12px;bottom:12px;height:64px;border-radius:999px;background:rgba(255,255,255,0.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;padding:0 6px;box-sizing:border-box}
.tab{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:#6B6B6B;border-radius:999px;position:relative}
.tab.on{color:#111111;background:#F5F5F3}
.badge{position:absolute;top:2px;left:50%;margin-left:6px;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#C94F0C;color:#FFFFFF;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
</style>

<div style="width:390px;height:1600px;box-sizing:border-box;position:relative;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;padding-bottom:96px">

  <div style="position:relative;width:390px;height:440px;overflow:hidden;flex:none">
    <img src="../assets/farmer.jpg" alt="귤을 든 강씨네 귤밭 농부" style="display:block;width:390px;height:440px;object-fit:cover">
    <div style="position:absolute;left:0;right:0;bottom:0;height:240px;background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.66) 100%)"></div>
    <a href="scr-01.html" class="ov" style="left:12px" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <button class="ov" style="right:12px" aria-label="농가 링크 공유"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
    <div style="position:absolute;left:20px;right:20px;bottom:24px;display:flex;flex-direction:column;gap:6px;color:#FFFFFF">
      <h1 class="t34" style="margin:0;color:#FFFFFF">강씨네 귤밭</h1>
      <span class="t15" style="opacity:0.88">제주 서귀포 · 팔로워 128명</span>
    </div>
  </div>

  <div style="padding:16px 20px 0;display:flex;gap:12px">
    <a href="#" class="btn-p">팔로우</a>
    <a href="#" class="btn-o">채팅하기</a>
  </div>

  <p class="t17" style="margin:16px 20px 0">3대째 효돈 하우스 감귤. 밭 소식은 일주일에 두 번, 당도는 잴 때마다 올려요.</p>

  <div style="padding:32px 20px 0">
    <div style="display:flex;background:#F5F5F3;border-radius:8px;padding:2px" role="tablist">
      <a href="#" role="tab" aria-selected="false" class="muted" style="flex:1;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:15px;font-weight:600">상품</a>
      <a href="#" role="tab" aria-selected="true" style="flex:1;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#FFFFFF;font-size:15px;font-weight:600">소식</a>
    </div>

    <div style="margin-top:8px;display:flex;flex-direction:column">
      <article style="display:flex;flex-direction:column;gap:10px;padding:16px 0">
        <span class="t13 muted">10월 7일 · 팔로워 전용</span>
        <img src="../assets/basket.jpg" alt="첫 바구니" style="display:block;width:350px;height:220px;border-radius:16px;object-fit:cover">
        <p class="t17" style="margin:0">첫 바구니 따봤어요. 아직 신맛이 조금 남아서 일주일 더 기다립니다.</p>
        <button class="like" aria-label="좋아요 42"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>좋아요 42</button>
      </article>
      <article style="display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px solid #E8E8E6">
        <span class="t13 muted">10월 5일 · 공개</span>
        <img src="../assets/greenhouse.jpg" alt="하우스 안 감귤나무" style="display:block;width:350px;height:220px;border-radius:16px;object-fit:cover">
        <p class="t17" style="margin:0">하우스 안 온도가 잘 유지돼서 실측 11.8Brix 나왔어요. 10일 전후로 첫 수확 시작합니다.</p>
        <button class="like" aria-label="좋아요 128"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>좋아요 128</button>
      </article>
    </div>
  </div>

  <nav class="tabbar">
    <a href="scr-01.html" class="tab on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>발견</a>
    <a href="scr-18.html" class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>소식</a>
    <a href="#" class="tab" aria-label="채팅, 안 읽음 2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4z"/></svg>채팅<span class="badge">2</span></a>
    <a href="#" class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>내 정보</a>
  </nav>
