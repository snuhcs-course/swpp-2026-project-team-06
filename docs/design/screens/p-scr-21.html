<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SCR-21 승인 대기</title>
</head>
<body>
<div class="x-dc">

<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111111;background:#FFFFFF;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:#111111;text-decoration:none}a:hover{color:#000000}
.p34{font-size:34px;font-weight:700;letter-spacing:-0.02em;line-height:1.2}
.p22{font-size:22px;line-height:1.4}
.p17{font-size:17px;line-height:1.5}
.muted{color:#6B6B6B}
.step{display:flex;gap:16px;align-items:flex-start;padding:16px 0}
.dot{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;font-weight:700}
.t34{font-size:34px;font-weight:700;letter-spacing:-0.02em;line-height:1.15}
.t22{font-size:22px;font-weight:700;letter-spacing:-0.01em;line-height:1.25}
.t17{font-size:17px;line-height:1.5}
.t15{font-size:15px;line-height:1.45}
.t13{font-size:13px;line-height:1.4}
</style>

<div style="width:390px;height:844px;box-sizing:border-box;position:relative;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:72px 20px 0;display:flex;flex-direction:column;gap:10px">
    <span class="t15 muted">위미 감귤농장 · 10월 7일 신청</span>
    <h1 class="t34" style="margin:0">확인 중이에요</h1>
    <p class="t17" style="margin:0">곧 전화를 드릴게요.</p>
  </div>
  <div style="padding:40px 20px 0;display:flex;flex-direction:column">
    <div class="step"><span class="dot" style="background:#111111;color:#FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span><span style="display:flex;flex-direction:column"><span class="t17" style="font-weight:600">신청 완료</span><span class="t15 muted">10월 7일</span></span></div>
    <div class="step" style="border-top:1px solid #E8E8E6"><span class="dot" style="border:2px solid #111111;box-sizing:border-box">2</span><span style="display:flex;flex-direction:column"><span class="t17" style="font-weight:700">전화·방문 확인 <span class="t15">지금</span></span><span class="t15 muted">010-4321-8765로 연락드려요</span></span></div>
    <div class="step" style="border-top:1px solid #E8E8E6;border-bottom:1px solid #E8E8E6"><span class="dot muted" style="border:2px solid #E8E8E6;box-sizing:border-box">3</span><span style="display:flex;flex-direction:column"><span class="t17 muted" style="font-weight:600">승인</span><span class="t15 muted">승인되면 상품을 올릴 수 있어요</span></span></div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 28px">
    <a href="#" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:16px;border:1.5px solid #111111;box-sizing:border-box;font-size:17px;font-weight:600">새로고침</a>
  </div>
</div>
</div>
</body>
</html>
