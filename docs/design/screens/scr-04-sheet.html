<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SCR-04 · 시트 옵션·수량</title>
</head>
<body>
<div class="x-dc">

<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2) format("woff2-variations")}
body{margin:0;color-scheme:light;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#111111;background:#FFFFFF;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:#111111;text-decoration:none}a:hover{color:#000000}
.t22{font-size:22px;font-weight:700;letter-spacing:-0.01em;line-height:1.25}
.t17{font-size:17px;line-height:1.5}
.t15{font-size:15px;line-height:1.45}
.muted{color:#6B6B6B}
.opt{display:flex;justify-content:space-between;align-items:center;min-height:60px;border-top:1px solid #E8E8E6;color:#111111}
.qb{width:48px;height:48px;border-radius:999px;border:1px solid #E8E8E6;background:#FFFFFF;color:#111111;font-size:22px;font-family:inherit;display:flex;align-items:center;justify-content:center}
</style>

<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#FFFFFF">
  <img src="../assets/basket.jpg" alt="" style="display:block;width:390px;height:390px;object-fit:cover">
  <div style="padding:20px">
    <div class="t22">하우스 감귤 5kg</div>
    <div style="font-size:34px;font-weight:700;margin-top:24px">29,000원</div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,0.4)"></div>

  <div role="dialog" aria-label="옵션과 수량" style="position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:8px 20px 28px;display:flex;flex-direction:column;gap:16px">
    <i style="display:block;width:36px;height:4px;border-radius:999px;background:#E8E8E6;margin:0 auto"></i>
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="t22">옵션과 수량</span><a href="#" aria-label="닫기" style="width:48px;height:48px;display:flex;align-items:center;justify-content:flex-end;color:#6B6B6B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>
    <div>
      <a href="#" class="opt"><span style="display:flex;align-items:center;gap:12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg><span class="t17" style="font-weight:600">5kg</span><span class="t15 muted">약 35~45과</span></span><span class="t17" style="font-weight:700">29,000원</span></a>
      <a href="#" class="opt"><span style="display:flex;align-items:center;gap:12px;padding-left:36px"><span class="t17">10kg</span><span class="t15 muted">약 70~90과</span></span><span class="t17">55,000원</span></a>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid #E8E8E6;padding-top:12px">
      <span style="display:flex;flex-direction:column"><span class="t17" style="font-weight:600">수량</span><span class="t15 muted">한 번에 최대 3개</span></span>
      <div style="display:flex;align-items:center;gap:4px">
        <button class="qb" aria-label="빼기" style="color:#6B6B6B">−</button>
        <span class="t17" style="width:40px;text-align:center;font-weight:700">2</span>
        <button class="qb" aria-label="더하기">+</button>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="t15 muted">5kg × 2 · 무료배송</span><span class="t17" style="font-weight:700">58,000원</span></div>
    <a href="scr-10.html" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:16px;background:#C94F0C;color:#FFFFFF;font-size:17px;font-weight:600">주문서로</a>
  </div>
</div>
</div>
</body>
</html>
