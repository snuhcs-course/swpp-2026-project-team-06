<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370">
<defs><style>text{font-family:Arial,sans-serif;fill:#233b30}.title{font-size:20px;font-weight:700}.name{font-size:18px;font-weight:700}.body{font-size:13px}.label{font-size:12px;fill:#4b6557}.box{fill:#f2f6f1;stroke:#73957c;stroke-width:1.6}.new{fill:#fff1dc;stroke:#c7883e;stroke-width:2}.line{fill:none;stroke:#647e6a;stroke-width:1.8}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#647e6a"/></marker></defs>
<rect width="960" height="370" rx="12" fill="white"/><text x="24" y="33" class="title">I3 private conversation and paid-order context</text>
<rect x="24" y="75" width="230" height="92" rx="9" class="box"/><text x="43" y="105" class="name">Thread</text><text x="43" y="130" class="body">Unique farm + consumer pair</text><text x="43" y="149" class="body">Current participant authorization</text>
<rect x="350" y="75" width="280" height="111" rx="9" class="new"/><text x="369" y="105" class="name">ThreadOrderContext</text><text x="369" y="130" class="body">PK: thread_id + order_id</text><text x="369" y="149" class="body">Created at; order lookup index</text><text x="369" y="168" class="body">Cascading references to both parents</text>
<rect x="726" y="75" width="210" height="92" rx="9" class="box"/><text x="745" y="105" class="name">Order</text><text x="745" y="130" class="body">Owner, farm and payment history</text><text x="745" y="149" class="body">Revalidated on every use</text>
<path d="M254 120 H350" class="line" marker-end="url(#arrow)"/><text x="268" y="107" class="label">1 → many</text><path d="M726 120 H630" class="line" marker-end="url(#arrow)"/><text x="643" y="107" class="label">many ← 1</text>
<rect x="24" y="238" width="230" height="70" rx="9" class="box"/><text x="43" y="267" class="name">ThreadMessage</text><text x="43" y="291" class="body">Persisted insertion sequence</text>
<rect x="550" y="238" width="386" height="70" rx="9" class="box"/><text x="569" y="267" class="name">OrderInquiry</text><text x="569" y="291" class="body">Separate formal problem / attachment record</text>
<path d="M139 167 V238" class="line" marker-end="url(#arrow)"/><text x="151" y="208" class="label">1 → many</text><path d="M831 167 V238" class="line" marker-end="url(#arrow)"/><path d="M254 156 Q460 214 550 263" class="line" marker-end="url(#arrow)"/>
<text x="24" y="345" class="body">Starting a paid-order chat creates no message, inquiry, follow or AI call. Context records do not grant authority.</text>
</svg>
