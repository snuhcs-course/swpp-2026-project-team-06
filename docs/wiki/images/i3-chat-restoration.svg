<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650">
<defs><style>text{font-family:Arial,sans-serif;fill:#233b30}.title{font-size:21px;font-weight:700}.name{font-size:16px;font-weight:700}.body{font-size:13px}.label{font-size:12px;fill:#526d5a}.box{fill:#f0f5ef;stroke:#78977e;stroke-width:1.6}.choice{fill:#fff1dc;stroke:#c48b48;stroke-width:1.6}.line{fill:none;stroke:#657e6b;stroke-width:1.8}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#657e6b"/></marker></defs>
<rect width="960" height="650" rx="12" fill="white"/><text x="24" y="34" class="title">Private reading position: authorization, fresh history and measured layout</text>
<rect x="24" y="65" width="565" height="67" rx="9" class="box"/><text x="43" y="92" class="name">1. Fetch and authorize the current head page</text><text x="43" y="114" class="body">Validate consumer, farm and server thread before reusing metadata.</text>
<rect x="673" y="65" width="263" height="67" rx="9" class="choice"/><text x="692" y="92" class="name">Denied or session invalid</text><text x="692" y="114" class="body">Clear protected view; show access state.</text>
<path d="M589 97 H673" class="line" marker-end="url(#a)"/><text x="602" y="85" class="label">denied</text>
<rect x="24" y="165" width="565" height="67" rx="9" class="box"/><text x="43" y="192" class="name">2. Acquire the exact session and visit lease</text><text x="43" y="214" class="body">No body/photo/token retention; old callbacks cannot save new state.</text><path d="M306 132 V165" class="line" marker-end="url(#a)"/>
<rect x="673" y="165" width="263" height="67" rx="9" class="box"/><text x="692" y="192" class="name">No history / bottom snapshot</text><text x="692" y="214" class="body">Render latest after observing layout.</text><path d="M589 198 H673" class="line" marker-end="url(#a)"/>
<rect x="24" y="265" width="565" height="67" rx="9" class="box"/><text x="43" y="292" class="name">3. Load fresh cursor pages to the saved boundary</text><text x="43" y="314" class="body">Reject cursor cycles and nonprogress; deduplicate by saved sequence.</text><path d="M306 232 V265" class="line" marker-end="url(#a)"/><text x="320" y="252" class="label">historical snapshot</text>
<rect x="673" y="265" width="263" height="67" rx="9" class="choice"/><text x="692" y="292" class="name">Transient history failure</text><text x="692" y="314" class="body">Expose retry; keep pending metadata.</text><path d="M589 297 H673" class="line" marker-end="url(#a)"/><path d="M804 332 V350 H615 V320 H589" class="line" marker-end="url(#a)"/><text x="774" y="346" class="label">retry</text>
<rect x="24" y="365" width="565" height="67" rx="9" class="box"/><text x="43" y="392" class="name">4. Restore the signed offset after measured layout</text><text x="43" y="414" class="body">Use the primary message, surviving neighbor or clamped fallback.</text><path d="M306 332 V365" class="line" marker-end="url(#a)"/>
<rect x="24" y="465" width="565" height="67" rx="9" class="box"/><text x="43" y="492" class="name">5. Keep a history reader anchored as content settles</text><text x="43" y="514" class="body">Compensate delayed photo/layout; show unseen arrivals; gate read progress.</text><path d="M306 432 V465" class="line" marker-end="url(#a)"/>
<rect x="673" y="465" width="263" height="67" rx="9" class="box"/><text x="692" y="492" class="name">Intentional gesture / latest</text><text x="692" y="514" class="body">Release old correction; follow user intent.</text><path d="M589 498 H673" class="line" marker-end="url(#a)"/>
<rect x="24" y="565" width="912" height="57" rx="9" class="choice"/><text x="43" y="590" class="name">Blur/unmount: save whitelisted geometry only through the current lease.</text><text x="43" y="610" class="body">Logout, token loss and a new login invalidate old authority. Reload begins without retained in-memory geometry.</text>
<path d="M306 532 V565" class="line" marker-end="url(#a)"/>
</svg>
