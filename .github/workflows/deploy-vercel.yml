name: Deploy apps to Vercel

# 소비자·생산자 앱 자동 배포(DEV-67). Vercel 프로젝트가 GitHub에 연결돼 있지 않아 Actions가 export한 dist/를
# Vercel CLI로 올린다. Expo는 EXPO_PUBLIC_* 값을 export 때 번들에 넣으므로 서버 주소·Mock 여부는 여기서 정한다.
# - main의 CI(ci.yml)가 성공한 뒤, CI가 검사한 커밋(head_sha)에 앱 관련 변경이 있을 때만 배포한다.
# - 레포 변수 APP_API_URL이 비어 있으면 Mock 빌드(브라우저 안 가짜 데이터), 값이 있으면 그 서버로 붙는 빌드.
# - 레포 변수 APP_POSTHOG_KEY(phc_…, 공개 키)가 있으면 PostHog 화면 이벤트·세션 녹화를 켠다(DEV-71). 비면 꺼진다.
#   APP_POSTHOG_HOST가 비면 앱 기본값 https://us.i.posthog.com(US Cloud, TQ-01)을 쓴다.
# - 사이트 하단 사업자 정보(DEV-113, R-16)는 Actions 변수 BUSINESS_NAME·BUSINESS_OWNER·BUSINESS_REGISTRATION_NO·
#   BUSINESS_MAIL_ORDER_NO·BUSINESS_ADDRESS·BUSINESS_PHONE·BUSINESS_EMAIL·PRIVACY_OFFICER로 넣는다(값은 레포에 두지 않는다).
#   빈 변수는 화면에서 빠지고, 모두 비면 ‘테스트 서비스’만 보인다. 바꾼 뒤에는 이 워크플로를 수동 실행해야 반영된다.
#   export 뒤 scripts/legal-pages.mjs가 같은 값으로 /privacy·/terms 정적 HTML과 index.html의 <noscript>를 만든다.
# - 시크릿 VERCEL_TOKEN이 없으면 배포를 건너뛴다(옵트인). 토큰 등록이 곧 자동 배포를 켜는 일이다.
# 수동 실행: Actions 탭 → 이 워크플로 → Run workflow. 브랜치는 main을 골라야 하고(다른 브랜치는 건너뜀),
# 변경 여부와 상관없이 현재 main을 두 앱 모두 올린다. 토큰은 production Environment(main 전용)에 둔다(DEV-70).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Vercel 계정·프로젝트 식별자(비밀값 아님). 계정: nemodleo-4232's projects
  VERCEL_ORG_ID: team_6lUgON5wzspF2xO89ivHAZEf
  CONSUMER_URL: https://farmclub.kr
  PRODUCER_URL: https://farm.farmclub.kr

jobs:
  deploy:
    # DEV-70: 수동 실행은 main에서만. 다른 브랜치에서 Run workflow를 눌러도 운영에 올리지 않는다.
    # workflow_run은 기본 브랜치(main) 정의·ref로 돌아서 github.ref가 항상 main이다.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    # 토큰은 production Environment 시크릿. 이 Environment는 main 브랜치에서만 배포를 허용하므로
    # 워크플로 파일을 고친 다른 브랜치에서 실행해도 토큰을 받지 못한다.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: consumer
            project_id: prj_maiNsmueKvOPCuxgwl889DdUmByA
            url: https://farmclub.kr
          - app: producer
            project_id: prj_Uz2IIY7l6h2PKZOGNekOn1MnZ457
            url: https://farm.farmclub.kr
    concurrency:
      group: vercel-deploy-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - name: Check the Vercel token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret is not set, so automatic app deploys are off. Add it under Settings → Secrets and variables → Actions to turn them on."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect app changes
        id: changes
        if: steps.token.outputs.enabled == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: deploying $(git rev-parse --short HEAD)."
            exit 0
          fi
          changed=$(git diff --name-only HEAD~1 HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/|packages/|package\.json$|package-lock\.json$|\.nvmrc$|scripts/legal-pages\.mjs$|\.github/workflows/deploy-vercel\.yml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No app changes in $(git rev-parse --short HEAD). Skipping the deploy."
          fi

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.deploy == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.deploy == 'true'
        run: npm ci --no-audit --no-fund

      - name: Export ${{ matrix.app }} for the web
        if: steps.changes.outputs.deploy == 'true'
        working-directory: apps/${{ matrix.app }}
        env:
          APP_API_URL: ${{ vars.APP_API_URL }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.APP_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.APP_POSTHOG_HOST }}
          EXPO_PUBLIC_SHARED_MOCK_URL: ""
          EXPO_PUBLIC_CONSUMER_URL: ${{ env.CONSUMER_URL }}
          EXPO_PUBLIC_PRODUCER_URL: ${{ env.PRODUCER_URL }}
          EXPO_PUBLIC_BUSINESS_NAME: ${{ vars.BUSINESS_NAME }}
          EXPO_PUBLIC_BUSINESS_OWNER: ${{ vars.BUSINESS_OWNER }}
          EXPO_PUBLIC_BUSINESS_REGISTRATION_NO: ${{ vars.BUSINESS_REGISTRATION_NO }}
          EXPO_PUBLIC_BUSINESS_MAIL_ORDER_NO: ${{ vars.BUSINESS_MAIL_ORDER_NO }}
          EXPO_PUBLIC_BUSINESS_ADDRESS: ${{ vars.BUSINESS_ADDRESS }}
          EXPO_PUBLIC_BUSINESS_PHONE: ${{ vars.BUSINESS_PHONE }}
          EXPO_PUBLIC_BUSINESS_EMAIL: ${{ vars.BUSINESS_EMAIL }}
          EXPO_PUBLIC_PRIVACY_OFFICER: ${{ vars.PRIVACY_OFFICER }}
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: |
          if [ -n "$APP_API_URL" ]; then
            export EXPO_PUBLIC_API_MOCK=0 EXPO_PUBLIC_API_URL="$APP_API_URL"
            echo "::notice::${{ matrix.app }}: server build against $APP_API_URL"
          else
            export EXPO_PUBLIC_API_MOCK=1 EXPO_PUBLIC_API_URL=""
            echo "::notice::${{ matrix.app }}: mock build (APP_API_URL repository variable is empty)"
          fi
          if [ -n "$EXPO_PUBLIC_POSTHOG_KEY" ]; then
            echo "::notice::${{ matrix.app }}: PostHog on (${EXPO_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com})"
          else
            echo "::notice::${{ matrix.app }}: PostHog off (APP_POSTHOG_KEY repository variable is empty)"
          fi
          npx expo export -p web
          node --no-warnings ../../scripts/legal-pages.mjs dist
          cp vercel.json dist/vercel.json

      - name: Deploy to Vercel (production)
        if: steps.changes.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ matrix.project_id }}
        run: npx --yes vercel@48 deploy "apps/${{ matrix.app }}/dist" --prod --yes --token "$VERCEL_TOKEN"

      - name: Check the live site
        if: steps.changes.outputs.deploy == 'true'
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${{ matrix.url }}")
            if [ "$code" = "200" ]; then
              echo "${{ matrix.url }} → 200"
              exit 0
            fi
            echo "attempt $i: $code, retrying in 10s"
            sleep 10
          done
          echo "::error::${{ matrix.url }} did not answer 200 after the deploy."
          exit 1
